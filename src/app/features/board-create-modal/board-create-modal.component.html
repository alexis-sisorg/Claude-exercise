<div class="modal-backdrop" (click)="onBackdropClick($event)" (keydown)="onKeydown($event)"
     role="dialog" aria-modal="true" aria-label="Create new board">

  <div class="modal-panel">

    <!-- Top accent bar -->
    <div class="modal-bar" [style.background]="'linear-gradient(90deg,' + selectedColor + ',' + selectedColor + '99)'"></div>

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-title-wrap">
        <svg class="modal-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.25"/>
          <rect x="9"   y="1.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.25"/>
          <rect x="1.5" y="9"   width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.25"/>
          <rect x="9"   y="9"   width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.25"/>
        </svg>
        <h2 class="modal-title">New Board</h2>
      </div>
      <button class="modal-close" (click)="closeModal.emit()" aria-label="Close">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Name field -->
      <div class="field">
        <label class="field-label" for="board-name">Board name</label>
        <input
          id="board-name"
          class="field-input"
          type="text"
          placeholder="e.g. Q3 Roadmap, Sprint 14…"
          autocomplete="off"
          maxlength="60"
          [value]="name"
          (input)="onInput($event)"
          autofocus
        />
      </div>

      <!-- Accent color -->
      <div class="field">
        <label class="field-label">Accent color</label>
        <div class="color-picker">
          @for (opt of accentOptions; track opt.value) {
            <button
              class="color-chip"
              [class.color-chip--selected]="selectedColor === opt.value"
              [style.--chip-color]="opt.value"
              [attr.aria-label]="opt.label"
              [title]="opt.label"
              type="button"
              (click)="selectColor(opt.value)"
            ></button>
          }
        </div>
      </div>

      <!-- Preview -->
      <div class="board-preview" [style.--preview-accent]="selectedColor">
        <div class="preview-bar"></div>
        <div class="preview-body">
          <div class="preview-dot"></div>
          <span class="preview-name">{{ name || 'Board name' }}</span>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" type="button" (click)="closeModal.emit()">Cancel</button>
      <button
        class="btn-create"
        type="button"
        [disabled]="!canCreate"
        [style.--btn-accent]="selectedColor"
        (click)="create()"
      >
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        Create board
      </button>
    </div>

  </div>
</div>
